name: Backend Tests

on:
  push:
    paths:
      - 'backend-node/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend-node/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --package-lock=false
      - run: npm audit --audit-level=high
      - run: npm test
